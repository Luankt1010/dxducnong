<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Google AI Studio App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 30px;
            border-radius: 10px;
            background-color: #1e1e1e;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 { color: #4285f4; }
        p { color: #bbbbbb; }
        button {
            background-color: #4285f4;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover { background-color: #357ae8; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Google AI Studio × GitHub</h1>
        <p>Chúc mừng bạn! Website của bạn đã kích hoạt thành công và đang chạy thực tế.</p>
        <button onclick="alert('Hệ thống hoạt động tốt!')">Kiểm tra thử</button>
    </div>

</body>
</html>
